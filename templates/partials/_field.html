<div class="{% if field.name == 'description' %}sm:col-span-2{% endif %}">
  <label for="{{ field.id_for_label }}" class="mb-1.5 block text-sm font-semibold text-slate-800">
    {{ field.label }}{% if field.field.required %}<span class="ml-1 text-rose-700" aria-label="required">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<p id="{{ field.id_for_label }}_help" class="mt-1.5 text-xs leading-5 text-slate-600">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p id="{{ field.id_for_label }}_error" class="mt-1.5 text-sm font-medium text-rose-700">{{ error }}</p>{% endfor %}
</div>
