{% if is_paginated %}
  <nav class="flex items-center justify-between gap-3 border-t border-slate-200 px-4 py-4 sm:px-6" aria-label="Pagination">
    <p class="text-sm text-slate-600">
      Page <span class="font-semibold text-slate-900">{{ page_obj.number }}</span> of <span class="font-semibold text-slate-900">{{ page_obj.paginator.num_pages }}</span>
    </p>
    <div class="flex items-center gap-2">
      {% if page_obj.has_previous %}
        <a href="{% querystring page=page_obj.previous_page_number %}" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-700">Previous</a>
      {% else %}
        <span class="rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-400" aria-disabled="true">Previous</span>
      {% endif %}
      {% if page_obj.has_next %}
        <a href="{% querystring page=page_obj.next_page_number %}" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-700">Next</a>
      {% else %}
        <span class="rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-400" aria-disabled="true">Next</span>
      {% endif %}
    </div>
  </nav>
{% endif %}
