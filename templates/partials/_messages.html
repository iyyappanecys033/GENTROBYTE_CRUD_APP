{% if messages %}
  <div class="mb-6 space-y-2" aria-live="polite" aria-atomic="false">
    {% for message in messages %}
      <div role="{% if message.tags == 'error' %}alert{% else %}status{% endif %}" class="flex items-start justify-between gap-4 rounded-xl border px-4 py-3 text-sm {% if message.tags == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-900{% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-950{% elif message.tags == 'error' %}border-rose-200 bg-rose-50 text-rose-900{% else %}border-blue-200 bg-blue-50 text-blue-950{% endif %}">
        <span>{{ message }}</span>
        <button type="button" class="shrink-0 rounded px-2 py-0.5 font-medium underline decoration-current/40 underline-offset-2 hover:decoration-current focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-current" aria-label="Dismiss notification" onclick="this.parentElement.remove()">Dismiss</button>
      </div>
    {% endfor %}
  </div>
{% endif %}
